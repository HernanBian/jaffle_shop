models:
  - name: stg_jaffle_shop__customers
    description: customer records from jaffle shop
    columns:
      - name: customer_id
        description: unique identifier for a customer; primary key for customers table
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: customer's given name
      - name: last_name
        description: customer's family name


  - name: stg_jaffle_shop__orders
    description: one order per row
    columns:
      - name: order_id
        description: primary key for orders table
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
